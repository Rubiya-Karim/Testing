<div class="login-background">
    <div class="row">
        <div class="col-md-5 p-2 view-partition">
            <div class="logo">
                <img src="../../../assets/images/Logo.png" class="image-size"/>
            </div>
    
            <div class="login-form-block bg-white p-5">
                <div class="login-text"><b>Login</b></div>
    
                <div class="form-style mt-5">
                    <form [formGroup]="loginForm" (ngSubmit)="onClickLogin()">
                        <div class="form-group mb-3">
                            <input type="email" placeholder="Email" class="form-control" formControlName="username" (blur)='loginUserIdValidation()' required>
                            <div *ngIf="submitted && ['f.username.errors']" class="invalid-feedback">
                                <div *ngIf="['f.username.errors.required']"><small>Email is required</small></div>
                            </div>
                            <div *ngIf="loginUserIdError" class="error-message"><small>Please enter a valid email Id</small>
                            </div>              
                        </div>
                        <div class="form-group mb-3">
                            <input type="password" placeholder="Password" formControlName="password" class="form-control" (blur)='loginPasswordValidation()'>
                            <div *ngIf="submitted && ['f.password.errors']" class="invalid-feedback">
                                <div *ngIf="['f.password.errors.required']"><small>Password is required</small></div>
                            </div>
                            <div *ngIf="loginPasswordError" class="error-message"><small>Please enter a Password.</small></div>
                            <div *ngIf="wrongPasswordError" class="error-message"><small>Wrong Password.</small></div>

                        </div>
        
                        <div class="d-flex flex-row-reverse forgot-password-text">
                            <a routerLink="/forgot-password">Forgot Password</a>
                        </div>
    
                        <div class="d-block pb-2 mt-5"> 
                            <button type="submit" class="btn btn-lg btn-block mt-2 login-button" [disabled]="!submitButton">Login</button>
                        </div>
                    </form>
                </div>
            </div>    
        </div>
    
        <div class="col-md-7 ">
            <div class="login-side-image-text mt-5">OPERATIONS<br />FRAMEWORK</div>
            <img src="../../../assets/images/login_side_image.png" class="img-fluid mt-5" />
        </div>  
    </div>
</div>
