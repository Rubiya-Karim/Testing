<div class="forgot-password-background">
    <div class="row">
        <div class="col-md-5 p-2 view-partition">
            <div class="logo">
                <img src="../../../assets/images/Logo.png" class="image-size" />
            </div>

                <div class="forgotpw-form-block bg-white p-5">
                    <form [formGroup]="forgotPWForm">

                    <div *ngIf="!isVerifyOtp">
                        <div class="forgotpw-text">Enter Registered Email </div>
                        <div class="form-style mt-2">
                            <div class="d-flex  forgot-password-text pb-3">
                                Enter your registered email to receive an OTP
                            </div>
                            <div class="form-group pb-3">
                                <input type="email" placeholder="Email address" class="form-control"
                                    formControlName="username" (blur)='emailIdValidation()' required>
                                <div *ngIf="['f.username.errors?.required']" class="error-message invalid-feedback">
                                    Email is
                                    required</div>
                                <div *ngIf="['f.username.errors?.email']" class="error-message invalid-feedback">Email
                                    is
                                    invalid.</div>
                                <div *ngIf="emailIDInputError" class="error-message">Please enter a valid email Id</div>
                            </div>
                            <button class="btn btn-lg btn-block mt-2 send-button" [disabled]="isGenOtp"
                                [hidden]="isVerifyOtp" (click)="onGenerateOTP(false)">Send</button>

                        </div>

                    </div>
                    <div *ngIf="isVerifyOtp">
                        <div class="forgotpw-text">Enter OTP</div>
                        <div class="form-style mt-2">
                            <div class="d-flex  forgot-password-text pb-3">
                                Enter your OTP received on your registered email.
                            </div>
                            <div class="form-group pb-3">
                                <input placeholder="OTP" class="form-control" formControlName="OTP"
                                    (blur)='OTPRequiredValidation()'>
                                <div *ngIf="['f.OTP.errors?.required']" class="error-message invalid-feedback">OTP is
                                    required</div>
                                <div *ngIf="OTPInputError" class="error-message">OTP is required</div>
                            </div>
                            <div class="d-block pb-2">
                                <button class="btn btn-lg btn-block w-100 mt-2 send-button" [disabled]="OTPInputError"
                                    (click)="onClickVerify()">Verify</button>
                                    
                                <button class="btn btn-lg btn-block w-100 mt-2 send-button"
                                (click)="onGenerateOTP(true)">Resend</button>
                            </div>

                        </div>
                    </div>
                    <div class="cancel-text p-2">
                        <a routerLink="/login">Cancel</a>
                    </div>
                </form>

                </div>
            
        </div>
        <div class="col-md-7 ">
            <!-- <div class="forgotpw-side-image-text mt-5"></div> -->
            <img src="../../../assets/images/resetpw-side-image.png" class="img-fluid mt-5" />
        </div>
    </div>
</div>
